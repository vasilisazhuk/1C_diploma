ВидЭлемента: КомпонентИнтерфейса
Ид: 1fbd0995-6ab7-4e0f-9aa0-c776fed9c3dc
Имя: Сотрудник_КонтактнаяИнформация
ОбластьВидимости: ВПроекте
Наследует:
    Тип: Группа
    Содержимое:
        -
            Тип: Группа
            Имя: ОсновнаяИнформация
            Компоновка: Вертикальная
            Содержимое:
                -
                    Тип: Надпись
                    Имя: Email
                    Заголовок: $ЛокализованныеСтроки.ЭлектроннаяПочта
