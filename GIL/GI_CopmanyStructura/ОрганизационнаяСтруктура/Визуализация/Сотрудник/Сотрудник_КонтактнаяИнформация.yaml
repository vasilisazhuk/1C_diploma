                    Тип: Надпись
                    Имя: РабТелефон
                    Заголовок: $ЛокализованныеСтроки.РабочийНомерТелефона
                    Значение: =РабТелефон_св
                -
                    Тип: Надпись
                    Имя: ВнутрТелефон
                    Заголовок: $ЛокализованныеСтроки.ВнутреннийНомерТелефона
                    Значение: =ВнутрТелефон_св
        -
            Тип: Группа
            Имя: ДополнительнаяИнформа
            Видимость: =Видимость_ДопИнфо
            Компоновка: Вертикальная
            Содержимое:
                -
                    Тип: Надпись
                    Имя: Мессенджеры
                    Видимость: =Мессенджеры_св!=""
                    Заголовок: $ЛокализованныеСтроки.Мессенджеры
                    Значение: =Мессенджеры_св
                -
                    Тип: Надпись
                    Имя: Филиал
                    Видимость: =Филиал_св!=""
                    Заголовок: $ЛокализованныеСтроки.Филиал
                    Значение: =Филиал_св
                -
                    Тип: Надпись
                    Имя: ЧасовойПояс
                    Видимость: =ЧасовойПояс_св!=""
                    Заголовок: $ЛокализованныеСтроки.ЧасовойПояс
                    Значение: =ЧасовойПояс_св
Свойства:
    -
        Имя: Email_св
        Тип: Строка
    -
        Имя: РабТелефон_св
        Тип: Строка
    -
        Имя: ВнутрТелефон_св
        Тип: Строка
    -
        Имя: Мессенджеры_св
        Тип: Строка
