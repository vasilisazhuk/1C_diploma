ВидЭлемента: КомпонентИнтерфейса
Ид: 88da9e04-cc60-4257-abe7-9f5a863216f2
Имя: НазначениеРуководителяФормаОбъекта
ОбластьВидимости: ВПодсистеме
Наследует:
    Тип: ФормаОбъекта<НазначениеРуководителя.Объект>
    ВключатьВАвтоИнтерфейс: Ложь
    Заголовок: Назначение руководителя
    ДополнительныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Обновить
            - =СоздатьКопию
            - =СоздатьНаОсновании
            - =Удалить
            - =Восстановить
    ОбычныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Записать
    ОсновнаяКоманда: =ЗаписатьИЗакрыть
    Содержимое:
        Тип: ПроизвольныйШаблонФормы
        ШиринаВКолонках: Четверная
        Содержимое:
            Тип: Группа
            Имя: ГруппаПолей
            Содержимое:
                -
                    Тип: ПолеВвода<ДатаВремя>
                    Имя: Дата
                    Значение: =Объект.Дата
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Номер
                    Значение: =Объект.Номер
                -
                    Тип: ПолеВвода<Строка>
                    Имя: СсылкаВСЭД
                    Значение: =Объект.СсылкаВСЭД
                -
                    Тип: ПолеВвода<Организации.Ссылка?>
                    Имя: Организация
                    Значение: =Объект.Организация
                -
                    Тип: ПолеВвода<Пользователи.Ссылка?>
                    Имя: Автор
                    Видимость: Ложь
                    Значение: =Объект.Автор
                -
                    Тип: ПолеВвода<ДатаВремя>
                    Имя: ДатаАктуализации
                    Видимость: Ложь
                    Значение: =Объект.ДатаАктуализации
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Комментарий
                    Значение: =Объект.Комментарий
                    НастройкиВводаСтроки:
                        Многострочная: Истина
                -
                    Тип: Таблица<ИсточникДанныхМассив<НазначениеРуководителя.Руководители>>
                    Имя: Руководители
                    ИспользоватьОтметкиСтрок: Истина
                    Источник:
                        Данные: =Объект.Руководители
                    Колонки:
                        -
                            Тип: СтандартнаяКолонкаТаблицы<НазначениеРуководителя.Руководители, Сотрудники.Ссылка|Строка|?>
                            Имя: Руководители_Руководитель
                            Значение: =RowData.Руководитель
                        -
                            Тип: СтандартнаяКолонкаТаблицы<НазначениеРуководителя.Руководители, Строка>
                            Имя: Руководители_НазначаемаяДолжность
                            Значение: =RowData.НазначаемаяДолжность
                        -
                            Тип: СтандартнаяКолонкаТаблицы<НазначениеРуководителя.Руководители, Строка>
                            Имя: Руководители_Комментарий
                            Значение: =RowData.Комментарий
                    Команды:
                        Тип: ФрагментКомандногоИнтерфейса
                        Элементы:
                            - =Компоненты.Руководители.ДобавитьСтроку
                    КомандыНадОтмеченнымиСтроками:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<НазначениеРуководителя.Руководители>>>
                        Элементы:
                            - =Компоненты.Руководители.ПереместитьСтрокуВверх
                            - =Компоненты.Руководители.ПереместитьСтрокуВниз
                            - =Компоненты.Руководители.Удалить
                    КомандыСтроки:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<НазначениеРуководителя.Руководители>>
                        Элементы:
                            - =Компоненты.Руководители.ПереместитьСтрокуВверх
                            - =Компоненты.Руководители.ПереместитьСтрокуВниз
                            - =Компоненты.Руководители.Удалить
